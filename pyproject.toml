[project]
name = "pymodelprune"
version = "0.4.0"
description = "Prune and quantize PyTorch models, then measure what you actually gained."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Berkay Yükünç" }]
keywords = ["pytorch", "pruning", "quantization", "model-compression", "onnx", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/berkayyukunc/pymodelprune"
Repository = "https://github.com/berkayyukunc/pymodelprune"
Issues = "https://github.com/berkayyukunc/pymodelprune/issues"
Changelog = "https://github.com/berkayyukunc/pymodelprune/blob/main/CHANGELOG.md"

[project.optional-dependencies]
quant = ["torchao>=0.10"]
# onnxruntime stopped shipping wheels for Python 3.10; the core package still supports it,
# and require_onnx() explains the missing extra instead of failing at install time.
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.18; python_version >= '3.11'",
    "onnxscript>=0.1",
]
all = ["pymodelprune[quant,onnx]"]

[project.scripts]
pymodelprune = "pymodelprune.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
examples = [
    "torchvision>=0.17",
]
extras = [
    "pymodelprune[all]",
]

[tool.uv]
default-groups = ["dev", "examples", "extras"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pymodelprune"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
